<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Name Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      background-color: #ffffff;
      color: #764ba2;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #eee;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      min-height: 24px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Project Name Generator</h1>
    <input type="text" id="topic" placeholder="Enter your project topic..." />
    <button onclick="generateName()">Generate</button>
    <div id="result"></div>
    <div class="footer">Powered by OpenRouter API + GPT-3.5</div>
  </div>

  <script>
    async function generateName() {
      const topic = document.getElementById("topic").value.trim();
      const resultDiv = document.getElementById("result");

      if (!topic) {
        resultDiv.innerText = "Please enter a topic!";
        return;
      }

      resultDiv.innerText = "⏳ Generating...";

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [
              {
                role: "user",
                content: `Create a short, creative, and catchy project name for this topic: "${topic}".`
              }
            ]
          })
        });

        const data = await response.json();
        const projectName = data.choices[0].message.content.trim();
        resultDiv.innerHTML = `🎯 <strong>${projectName}</strong>`;
      } catch (error) {
        resultDiv.innerText = "❌ Error generating name.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
